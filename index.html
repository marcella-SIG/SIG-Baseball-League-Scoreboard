<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIG Baseball League Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0d1f3f; --navy-2:#132a52; --navy-3:#1b3768;
    --gold:#e9b93c; --gold-dim:#8a6f26;
    --cream:#f4efe1; --red:#c8322f;
    --grass:#2f6b3a; --grass-2:#3a7d46;
    --dirt:#4a3a1c; --muted:#7e93b8;
    --up:#4fbf6a; --down:#e8654f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--navy); color:var(--cream);
    font-family:"Barlow Condensed","Arial Narrow",sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .bunting-wrap{height:36px;overflow:hidden;flex:none;border-top:3px solid #08152c}
  .bunting-wrap svg{display:block;width:100%;height:36px}

  header{display:flex;align-items:center;gap:18px;padding:14px 26px 8px;flex:none}
  .mark{width:38px;height:38px;flex:none}
  .titles{flex:1;min-width:0}
  h1{font-family:"Anton",Impact,sans-serif;font-size:clamp(24px,3.2vw,44px);
     letter-spacing:.02em;line-height:1;color:#fff;text-transform:uppercase}
  .rule{height:3px;width:min(340px,60%);background:var(--gold);margin-top:5px}
  .sub{font-style:italic;font-weight:700;letter-spacing:.14em;color:var(--gold);
       text-transform:uppercase;font-size:13px;margin-top:5px}
  .banner{
    background:var(--cream);color:var(--navy);
    font-family:"Anton",Impact,sans-serif;font-size:clamp(16px,1.8vw,26px);
    padding:12px 26px 12px 34px;
    clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%);
    letter-spacing:.03em;white-space:nowrap;
  }

  .tabs{display:flex;padding:0 26px;flex:none;border-bottom:2px solid var(--gold-dim)}
  .tab{font-family:"Anton",Impact,sans-serif;font-size:16px;letter-spacing:.08em;
    text-transform:uppercase;background:transparent;color:var(--muted);
    border:2px solid transparent;border-bottom:none;padding:9px 26px;cursor:pointer}
  .tab:hover{color:var(--cream)}
  .tab:focus-visible{outline:2px solid var(--cream);outline-offset:-4px}
  .tab[aria-selected="true"]{color:var(--navy);background:var(--gold);border-color:var(--gold)}

  .subbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 26px 10px;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);flex:none}
  .subbar button, .subbar select{
    font:inherit;text-transform:uppercase;letter-spacing:.08em;
    background:transparent;color:var(--gold);border:1px solid var(--gold-dim);
    padding:3px 12px;cursor:pointer}
  .subbar button:hover{background:var(--gold);color:var(--navy)}
  .subbar select{color:var(--cream)}
  .subbar select option{background:var(--navy-2)}
  .savenote{display:none;width:100%;box-sizing:border-box;margin:10px 0 0;padding:11px 14px;
    border-radius:4px;font-size:14px;font-weight:700;text-align:center;letter-spacing:.02em;
    border:2px solid transparent}
  .savenote:empty{display:none}
  .savenote.ok{display:block;background:rgba(79,191,106,.15);border-color:var(--up);color:var(--up)}
  .savenote.warn{display:block;background:rgba(232,101,79,.15);border-color:var(--down);color:var(--down)}

  main{flex:1;padding:4px 22px 26px}
  .board{display:grid;gap:16px;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start}

  .card{border:2px solid var(--gold-dim);background:var(--navy-2);padding:12px;
    display:flex;flex-direction:column;gap:9px;position:relative}
  .card.leader{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .crown{position:absolute;top:-11px;right:10px;background:var(--gold);color:var(--navy);
    font-family:"Anton",Impact,sans-serif;font-size:11px;letter-spacing:.1em;padding:2px 8px}
  .team-name{border:1.5px solid var(--gold-dim);text-align:center;padding:7px 6px;
    font-family:"Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;
    font-size:clamp(12px,1.05vw,17px);color:var(--muted);line-height:1.15;
    min-height:44px;display:flex;align-items:center;justify-content:center}
  .score-box{border:2px solid var(--gold);text-align:center;padding:6px 4px 8px}
  .score-box .lbl{font-family:"Anton",Impact,sans-serif;color:var(--gold);
    letter-spacing:.06em;font-size:14px;text-transform:uppercase}
  .score-box .val{font-family:"Anton",Impact,sans-serif;color:#fff;
    font-size:clamp(34px,3.6vw,52px);line-height:1}
  .sec{font-family:"Anton",Impact,sans-serif;color:var(--gold);text-align:center;
    letter-spacing:.06em;font-size:15px;text-transform:uppercase;margin-top:2px}
  .sec.bench-lbl{color:var(--muted)}

  .row{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:5px;
    border:1.5px solid transparent}
  .row.start{background:var(--dirt);border-color:var(--gold-dim)}
  .row.bench{background:var(--navy-3);opacity:.75}
  .row.roster{background:var(--navy-3)}
  .num{width:19px;height:19px;border-radius:50%;flex:none;display:flex;
    align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;
    font-size:10px;font-weight:700;background:var(--gold);color:var(--navy)}
  .row.bench .num{background:var(--muted);color:var(--navy)}
  .nm{flex:1;min-width:0;font-style:italic;font-weight:700;text-transform:uppercase;
    letter-spacing:.02em;font-size:clamp(12px,1.05vw,16px);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pts{width:34px;flex:none;text-align:center;border:1.5px solid var(--gold);
    font-family:"Roboto Mono",monospace;font-weight:700;font-size:14px;padding:2px 0}
  .row.bench .pts{border-color:var(--muted)}
  .starts{width:38px;flex:none;text-align:center;font-family:"Roboto Mono",monospace;
    font-size:12px;color:var(--muted)}
  .ct{width:62px;flex:none;text-align:center;font-family:"Roboto Mono",monospace;
    font-size:11px;color:var(--muted);letter-spacing:.02em}
  .ct b{color:var(--cream);font-weight:700}
  .row.bench .ct b{color:var(--muted)}
  .flag{flex:none;font-family:"Anton",Impact,sans-serif;font-size:10px;
    letter-spacing:.08em;padding:1px 5px}
  .flag.in{background:var(--up);color:#062b12}
  .flag.out{background:var(--down);color:#3a0d05}
  .flag.suit{background:#f4ff2a;color:#2b2600;font-weight:700}

  .swap-note{border-top:1px dashed var(--gold-dim);padding-top:8px;font-size:12px;
    line-height:1.4;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .swap-note b{color:var(--cream)}

  .colhead{display:flex;gap:8px;padding:0 8px 2px;font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim)}
  .colhead .nm{font-style:normal;font-weight:600}
  .colhead .pts{border:none;font-family:inherit;font-size:10.5px;font-weight:600}
  .colhead .starts{font-family:inherit;font-size:10.5px;font-weight:600}
  .team-col{width:150px;flex:none;font-size:11px;color:var(--muted);text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .colhead .team-col{font-family:inherit;font-size:10.5px;font-weight:600;color:var(--gold-dim)}
  .stats-card{max-width:980px;margin:0 auto;overflow-x:auto}
  .stats-head{font-size:14px;letter-spacing:0;text-transform:none;color:var(--gold);
    font-family:Arial,Helvetica,sans-serif}
  .stats-head .nm,.stats-head .team-col{font-size:14px;font-weight:700;
    font-family:Arial,Helvetica,sans-serif}
  .stat-col{width:68px;flex:none;text-align:center;font-family:"Roboto Mono",monospace;
    font-size:13px;color:var(--cream)}
  .stats-head .stat-col{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;
    line-height:1.25;white-space:normal}
  .stat-col.total{border:1.5px solid var(--gold);border-radius:2px;padding:2px 0;
    font-weight:700;color:var(--gold)}
  .stat-col.payout,.stat-col.payout-head{width:110px}
  .stat-col.payout{font-family:"Roboto Mono",monospace;font-weight:700;font-size:14px;
    color:var(--muted)}
  .stat-col.payout.earning{color:var(--up)}
  .stat-col.payout.suits{font-family:Arial,Helvetica,sans-serif;font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;color:var(--down)}

  .legend{padding:16px 4px 0;font-size:12.5px;color:var(--muted);
    letter-spacing:.06em;text-transform:uppercase;line-height:1.7}
  .legend b{color:var(--gold)}

  /* ---- editor ---- */
  .edit-intro{color:var(--muted);font-size:13.5px;letter-spacing:.04em;
    text-transform:uppercase;line-height:1.7;padding:2px 4px 14px}
  .edit-intro b{color:var(--gold)}
  .suits-callout{max-width:720px;margin:0 auto 14px;padding:10px 14px;border-radius:4px;
    font-size:13px;font-weight:700;text-align:center;border:2px solid transparent}
  .suits-callout:empty{display:none}
  .suits-callout.some{background:rgba(232,101,79,.15);border-color:var(--down);color:var(--down)}
  .suits-callout.none{background:rgba(79,191,106,.15);border-color:var(--up);color:var(--up)}
  .edit-grid{display:grid;gap:16px;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start}
  .ecard{border:2px solid var(--gold-dim);background:var(--navy-2);padding:12px;
    display:flex;flex-direction:column;gap:8px}
  .ecard .tname{width:100%;background:var(--navy-3);color:var(--cream);
    border:1.5px solid var(--gold-dim);padding:7px 8px;font-family:"Anton",Impact,sans-serif;
    text-transform:uppercase;letter-spacing:.03em;font-size:13px;text-align:center}
  .escore{text-align:center;font-family:"Anton",Impact,sans-serif;color:var(--gold);
    font-size:13px;letter-spacing:.06em}
  .escore span{color:#fff;font-size:20px;margin-left:6px}
  .both-flag{background:rgba(232,185,35,.15);border:1px solid var(--gold);color:var(--gold);
    font-size:10.5px;letter-spacing:.02em;text-align:center;padding:5px 6px;border-radius:3px}
  .locked-banner{background:rgba(227,25,55,.12);border:1.5px solid var(--down);color:var(--down);
    font-family:"Anton",Impact,sans-serif;letter-spacing:.04em;text-align:center;
    padding:10px;margin-bottom:14px;border-radius:4px;font-size:14px}
  .ecard.is-locked{opacity:.55}
  .ecard.is-locked input,.ecard.is-locked select,.ecard.is-locked button{pointer-events:none}
  .epot-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:10.5px;
    letter-spacing:.03em;color:var(--muted);text-transform:uppercase}
  .epot-row input{width:64px;background:var(--navy-3);color:var(--cream);
    border:1px solid var(--gold-dim);padding:4px 6px;font-family:"Roboto Mono",monospace;font-size:12px}
  .epot-row .epot-total{width:100%;color:var(--gold);text-transform:none;letter-spacing:0;font-size:10.5px}
  .ehead{display:flex;gap:6px;padding:0 2px;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--gold-dim)}
  .ehead .eh-nm{flex:1}
  .ehead .eh-pt{width:44px;text-align:center}
  .ehead .eh-ct{width:52px;text-align:center}
  .ehead .eh-rl{width:78px;text-align:center}
  .ehead .eh-x{width:22px}
  .erow{display:flex;gap:6px;align-items:center}
  .erow input.enm{flex:1;min-width:0;background:var(--navy-3);color:var(--cream);
    border:1px solid var(--gold-dim);padding:5px 7px;font:inherit;font-size:13px;
    font-style:italic;text-transform:uppercase}
  .erow input.ept{width:44px;background:var(--navy-3);color:var(--cream);
    border:1px solid var(--gold-dim);padding:5px 4px;font-family:"Roboto Mono",monospace;
    font-size:13px;text-align:center}
  .erow input.ect{width:44px;background:var(--navy-3);color:var(--cream);
    border:1px solid var(--gold-dim);padding:5px 4px;font-family:"Roboto Mono",monospace;
    font-size:13px;text-align:center}
  .erow input.ect.bonus-hit{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .ect-wrap{width:52px;display:flex;flex-direction:column;align-items:center;gap:1px}
  .ect-badge{font-size:8px;letter-spacing:.04em;color:var(--gold);text-transform:uppercase;
    visibility:hidden}
  .ect-badge.show{visibility:visible}
  .erow select.erl{width:78px;background:var(--navy-3);color:var(--cream);
    border:1px solid var(--gold-dim);padding:5px 4px;font:inherit;font-size:12px;cursor:pointer}
  .erow select.erl option{background:var(--navy-2)}
  .erow .ex{width:22px;flex:none;background:transparent;border:1px solid var(--down);
    color:var(--down);cursor:pointer;font-size:13px;line-height:1;padding:4px 0}
  .erow .ex:hover{background:var(--down);color:#3a0d05}
  .eadd{margin-top:2px;background:transparent;border:1px dashed var(--gold-dim);
    color:var(--gold);padding:5px;cursor:pointer;font:inherit;font-size:12px;
    text-transform:uppercase;letter-spacing:.06em}
  .eadd:hover{background:var(--gold);color:var(--navy)}
  .pot-row{display:flex;align-items:center;gap:10px;padding:14px 4px 0;
    color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .pot-row input{width:90px;background:var(--navy-3);color:var(--cream);
    border:1px solid var(--gold-dim);padding:5px 7px;font-family:"Roboto Mono",monospace;font-size:14px}
  .save-now-btn{display:block;width:100%;margin:0 0 16px;padding:13px;
    background:var(--gold);color:var(--navy);border:none;border-radius:4px;
    font-family:"Anton",Impact,sans-serif;font-size:16px;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer}
  .save-now-btn:hover{background:#fdd35c}
  .save-now-btn:active{background:#c99f2e}
  .save-now-btn:disabled{opacity:.6;cursor:default}

  footer{height:26px;flex:none;
    background:repeating-linear-gradient(90deg,var(--grass) 0 46px,var(--grass-2) 46px 92px)}

  @media (max-width:1100px){.board,.edit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:620px){.board,.edit-grid{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style>
</head>
<body>

<div class="bunting-wrap">
  <svg viewBox="0 0 1200 36" preserveAspectRatio="none" aria-hidden="true">
    <rect width="1200" height="36" fill="#0d1f3f"/><g id="flags"></g>
  </svg>
</div>

<header>
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="18" fill="#f4efe1" stroke="#0d1f3f" stroke-width="1.5"/>
    <path d="M8 8c6 5 6 19 0 24M32 8c-6 5-6 19 0 24" stroke="#c8322f" stroke-width="1.8" fill="none"/>
  </svg>
  <div class="titles">
    <h1>SIG Baseball League</h1>
    <div class="rule"></div>
    <div class="sub">Live Scoreboard</div>
  </div>
  <div class="banner" id="banner">Week 1</div>
</header>

<div class="tabs" role="tablist">
  <button class="tab" id="tabWeek"  role="tab" aria-selected="true">Weekly</button>
  <button class="tab" id="tabMonth" role="tab" aria-selected="false">Month</button>
  <button class="tab" id="tabStats" role="tab" aria-selected="false">Player Stats</button>
  <button class="tab" id="tabEdit"  role="tab" aria-selected="false">Edit Data</button>
</div>

<div class="subbar">
  <select id="monthPick" aria-label="Month" style="display:none"></select>
  <span id="ctxLabel">Week</span>
  <select id="weekPick" aria-label="Week"></select>
  <button id="addWeekBtn" type="button">Add next week</button>
  <button id="delWeekBtn" type="button">Delete this week</button>
  <button id="newMonthBtn" type="button">Start New Month</button>
  <button id="lockBtn" type="button">Lock This Month</button>
  <button id="exportBtn" type="button">Export backup</button>
  <button id="importBtn" type="button">Import backup</button>
  <button id="refreshBtn" type="button">Refresh</button>
  <input id="importFile" type="file" accept="application/json" style="display:none">
</div>
<div class="savenote" id="saveNote"></div>

<main>
  <div id="boardWrap">
    <div class="board" id="board"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div id="statsWrap" style="display:none">
    <div class="edit-intro" id="statsIntro"></div>
    <div class="suits-callout" id="suitsCallout"></div>
    <div class="card stats-card">
      <div class="colhead stats-head">
        <span class="num" style="visibility:hidden"></span>
        <span class="nm">Agent</span>
        <span class="team-col">Team</span>
        <span class="stat-col">Total Starts</span>
        <span class="stat-col">Offers Logged</span>
        <span class="stat-col">Weeks Hit 50+</span>
        <span class="stat-col">Total Contacts</span>
        <span class="stat-col">Avg Contacts / Wk</span>
        <span class="stat-col">Avg Offers / Wk</span>
        <span class="stat-col total">Total Points</span>
        <span class="stat-col payout-head">Payout If Team Wins</span>
      </div>
      <div id="statsRows"></div>
    </div>
  </div>
  <div id="editWrap" style="display:none">
    <div class="locked-banner" id="lockedBanner" style="display:none"></div>
    <div class="edit-intro" id="editIntro"></div>
    <button id="saveNowBtn" type="button" class="save-now-btn">Save Now</button>
    <div class="edit-grid" id="editGrid"></div>
    <div class="pot-row">Base pot (all teams start here) $
      <input id="potInput" type="number" min="0" step="50">
      — each team's own added bonus is set in their card above
    </div>
    <button id="saveNowBtn2" type="button" class="save-now-btn">Save Now</button>
  </div>
</main>

<footer></footer>

<script>
/* ================================================================
   SHARED SCOREBOARD. Data lives in cloud storage tied to this
   artifact, so every agent who opens the link sees the same
   live standings. Last write wins if two people edit at once.
================================================================ */

var SEED = {
  pot: 1500,
  monthLabel: "September",
  metricLabel: "BOVs",
  locked: false,
  displayNames: {
    "Team One":   "Team One",
    "Team Two":   "Team Two",
    "Team Three": "Team Three"
  },
  teamPotBonus: {
    "Team One": 0,
    "Team Two": 0,
    "Team Three": 0
  },
  weeks: [
    { week: 1, teams: [
      { sheetName: "Team One", players: [
        { name: "Jordan", points: 0, contacts: 0, starter: true },
        { name: "Paige", points: 0, contacts: 0, starter: true },
        { name: "Seth", points: 0, contacts: 0, starter: true },
        { name: "Hunter", points: 0, contacts: 0, starter: false },
        { name: "Patrick", points: 0, contacts: 0, starter: false }
      ]},
      { sheetName: "Team Two", players: [
        { name: "Schuh", points: 0, contacts: 0, starter: true },
        { name: "Stratton", points: 0, contacts: 0, starter: true },
        { name: "Marsh", points: 0, contacts: 0, starter: true },
        { name: "Jeremy", points: 0, contacts: 0, starter: false },
        { name: "Nate", points: 0, contacts: 0, starter: false }
      ]},
      { sheetName: "Team Three", players: [
        { name: "Cayson", points: 0, contacts: 0, starter: true },
        { name: "Tommy", points: 0, contacts: 0, starter: true },
        { name: "Burt", points: 0, contacts: 0, starter: true },
        { name: "Jack", points: 0, contacts: 0, starter: false },
        { name: "Willy", points: 0, contacts: 0, starter: false }
      ]}
    ]}
  ]
};

var API_URL = "https://script.google.com/macros/s/AKfycbybrnFdrlQv-gl067jFZGWxgDCSGqAGGOOf2Bqx7ki1O6qWVUnUsM_gsjeqLsu42BlYMw/exec";
var $ = function (id) { return document.getElementById(id); };
var view = "week";
var selectedWeek = 1;
var persistOK = true;
var state = null;

/* ---------- state + persistence (Google Sheet backend via Apps Script) ---------- */
async function loadState() {
  var bustUrl = API_URL + (API_URL.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now();
  var res = await fetch(bustUrl, { method: "GET", cache: "no-store" }); // force a real network hit, never a cached response
  if (!res.ok) throw new Error("Server returned " + res.status);
  var text = await res.text();
  if (text) return JSON.parse(text);
  return JSON.parse(JSON.stringify(SEED)); // genuinely empty response = brand new sheet, first-ever load
}
var saveSeq = 0;
async function save() {
  var mySeq = ++saveSeq; // guards against an older, slower request landing after a newer one
  var wrongPin = false;
  try {
    var res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
      body: JSON.stringify({ pin: editPin, data: state })
    });
    var data = await res.json();
    if (mySeq !== saveSeq) return; // a newer save has already started — this response is stale, ignore it
    persistOK = !!(data && data.ok);
    if (data && data.error === "bad_pin") { wrongPin = true; editPin = null; pinVerified = false; }
  } catch (e) {
    if (mySeq !== saveSeq) return;
    persistOK = false;
  }
  showSaveNote(wrongPin);
}

// Serialized save queue: guarantees this browser tab never has two save requests in
// flight at once, so a slow earlier request can never land on the server AFTER a
// newer one and silently overwrite it. Typing triggers queueSave() (debounced); Save
// Now always waits for anything in-flight to finish first, then sends fresh state.
var saveDebounceTimer = null;
var saveInFlight = null;
var saveQueuedAgain = false;
function queueSave() {
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(runSaveChain, 600);
}
function runSaveChain() {
  if (saveInFlight) { saveQueuedAgain = true; return; }
  saveInFlight = save().then(function () {
    saveInFlight = null;
    if (saveQueuedAgain) { saveQueuedAgain = false; runSaveChain(); }
  });
}
async function waitForPendingSave() {
  clearTimeout(saveDebounceTimer);
  if (saveInFlight) await saveInFlight;
}
function showSaveNote(wrongPin) {
  var n = $("saveNote");
  if (persistOK) { n.className = "savenote ok"; n.textContent = "Saved — everyone with this link sees it"; }
  else if (wrongPin) { n.className = "savenote warn"; n.textContent = "Wrong PIN — change not saved. Click Edit Data again to re-enter it."; }
  else { n.className = "savenote warn"; n.textContent = "Couldn't save. Use Export backup to keep a copy."; }
}

/* ---------- helpers ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
  });
}
var viewingArchive = null; // null = live current month; otherwise index into state.monthHistory
function activeData() {
  return viewingArchive === null ? state : state.monthHistory[viewingArchive];
}
function activeLabel() {
  return viewingArchive === null ? (state.monthLabel || "Current") : state.monthHistory[viewingArchive].label;
}
function displayName(sheetName) {
  var d = activeData();
  return (d.displayNames && d.displayNames[sheetName]) || sheetName;
}
function getWeek(n) {
  var wks = activeData().weeks;
  for (var i = 0; i < wks.length; i++) if (wks[i].week === n) return wks[i];
  return null;
}
function contactBonus(p) {
  var v = activeScoringVersion();
  return (Number(p.contacts) || 0) >= 50 ? (v >= 2 ? 2 : 1) : 0;
}
function bothBonus(p) {
  if (activeScoringVersion() < 2) return 0; // both-goal bonus didn't exist under the old rules
  var hitOffer = (Number(p.points) || 0) > 0;
  var hitContact = (Number(p.contacts) || 0) >= 50;
  return (hitOffer && hitContact) ? 1 : 0;
}
function totalPoints(p) {
  return (Number(p.points) || 0) + contactBonus(p) + bothBonus(p);
}
// Which scoring rules apply to whatever month is currently being viewed. Each month (live or
// archived) is tagged with the ruleset it was actually tracked under, so changing the rules
// going forward never reaches back and re-scores a month that's already closed out.
// v1 = old rules (1pt/50-contacts, no both-goal bonus, pot split by starts)
// v2 = current rules (2pt/50-contacts, +1 both-goal bonus, pot split by points)
function activeScoringVersion() {
  var d = activeData();
  if (d.scoringVersion != null) return d.scoringVersion;
  return viewingArchive === null ? 2 : 1;
}
// Every team starts a month at the same base pot ($1,500). On top of that, each team can
// build up its OWN discretionary bonus — the boss adds to it whenever that team's whole
// starting lineup hits both goals in the same week. That bonus only ever pays out if THIS
// team is the one that wins the month; other teams' bonuses never factor in. (Only applies
// under the new rules — v1 months never had per-team bonuses.)
function ensureMonthDefaults(s) {
  if (!s.teamPotBonus) s.teamPotBonus = {};
  (s.weeks && s.weeks[0] ? s.weeks[0].teams : []).forEach(function (t) {
    if (s.teamPotBonus[t.sheetName] == null) s.teamPotBonus[t.sheetName] = 0;
  });
  Object.keys(s.displayNames || {}).forEach(function (sn) {
    if (s.teamPotBonus[sn] == null) s.teamPotBonus[sn] = 0;
  });
  if (s.locked == null) s.locked = false;
}
function effectivePot(sheetName) {
  var d = activeData();
  if (activeScoringVersion() < 2) return Number(d.pot) || 0; // v1 months had a single flat pot, no per-team bonus
  return (Number(d.pot) || 0) + (Number((d.teamPotBonus || {})[sheetName]) || 0);
}
function isLocked() {
  return !!activeData().locked;
}
// Every starting lineup slot on the team hit BOTH goals this week — the signal that the boss
// may want to add to that team's pot bonus.
function teamHitBothThisWeek(t) {
  var starters = t.players.filter(function (p) { return p.starter; });
  if (!starters.length) return false;
  return starters.every(function (p) { return bothBonus(p) === 1; });
}
function teamScore(t) {
  return t.players.filter(function (p) { return p.starter; })
    .reduce(function (s, p) { return s + totalPoints(p); }, 0);
}
/* ---------- tie-break logic ----------
   Same total points: offer points always outweigh the 50-contacts bonus,
   so whoever has more raw offers wins the tie first — even if the other
   player's extra points came from crossing 50 contacts (or from hitting
   both goals). If offers are also tied, higher raw contacts wins. If
   that's tied too (e.g. a fresh 0-0-0 week), keep the incumbent starter
   in place rather than falling back to raw array order.
*/
function lineupSort(a, b) {
  var diff = totalPoints(b) - totalPoints(a);
  if (diff !== 0) return diff;
  var odiff = (Number(b.points) || 0) - (Number(a.points) || 0);
  if (odiff !== 0) return odiff;
  var cdiff = (Number(b.contacts) || 0) - (Number(a.contacts) || 0);
  if (cdiff !== 0) return cdiff;
  return (b.starter ? 1 : 0) - (a.starter ? 1 : 0);
}
function projectLineup(t) {
  var n = t.players.filter(function (p) { return p.starter; }).length;
  var ranked = t.players.slice().sort(lineupSort);
  var next = {};
  ranked.slice(0, n).forEach(function (p) { next[p.name] = true; });
  return {
    promoted: t.players.filter(function (p) { return !p.starter && next[p.name]; }),
    demoted:  t.players.filter(function (p) { return  p.starter && !next[p.name]; })
  };
}

/* ---------- player stats (month-to-date, all players regardless of starter status) ---------- */
function rollupPlayerStats() {
  var d = activeData();
  var map = {};
  d.weeks.forEach(function (wk) {
    wk.teams.forEach(function (t) {
      t.players.forEach(function (p) {
        if (!map[p.name]) map[p.name] = { name: p.name, team: t.sheetName, offers: 0, weeks50: 0, contacts: 0, starts: 0, weeksPlayed: 0, seasonPoints: 0 };
        var rec = map[p.name];
        rec.team = t.sheetName; // most recent team wins
        rec.offers += (Number(p.points) || 0);
        rec.contacts += (Number(p.contacts) || 0);
        if (contactBonus(p) > 0) rec.weeks50 += 1;
        if (p.starter) {
          rec.starts += 1;
          rec.seasonPoints += totalPoints(p); // only Starting Lineup points count, same as team scoring
        }
        rec.weeksPlayed += 1;
      });
    });
  });
  var list = Object.keys(map).map(function (k) { return map[k]; });
  var ver = activeScoringVersion();

  // v2 (current rules): split each team's pot by points — most points earns the most money.
  // v1 (legacy): split by starts, same as this month was actually tracked at the time.
  var teamPoints = {}, teamStarts = {};
  list.forEach(function (r) {
    teamPoints[r.team] = (teamPoints[r.team] || 0) + r.seasonPoints;
    teamStarts[r.team] = (teamStarts[r.team] || 0) + r.starts;
  });

  list.forEach(function (r) {
    if (ver >= 2) {
      r.total = r.seasonPoints;
      r.inSuits = r.total === 0; // 0 points this month — no money, in suits until you get a point
      var tPoints = teamPoints[r.team] || 0;
      r.payout = (r.inSuits || tPoints <= 0) ? 0 : Math.round((r.seasonPoints / tPoints) * effectivePot(r.team));
    } else {
      r.total = r.offers + r.weeks50; // legacy total (all weeks, not starter-only)
      r.inSuits = r.starts === 0; // never started a single week this month
      var tStarts = teamStarts[r.team] || 0;
      r.payout = (r.inSuits || tStarts <= 0) ? 0 : Math.round((r.starts / tStarts) * effectivePot(r.team));
    }
    r.avgContacts = r.weeksPlayed ? r.contacts / r.weeksPlayed : 0;
    r.avgOffers = r.weeksPlayed ? r.offers / r.weeksPlayed : 0;
  });
  list.sort(function (a, b) { return b.total - a.total || b.offers - a.offers; });
  return list;
}
function renderStats() {
  $("banner").textContent = activeLabel() + " — Player Stats";
  var ver = activeScoringVersion();
  $("statsIntro").innerHTML = ver >= 2
    ? '<b>This contest resets monthly.</b> Payout below assumes your current team ends up winning the pot for ' +
      'this contest period, split by each player\'s share of their team\'s total points — most points on the team ' +
      'earns the most money. A player with <b>0 points</b> this month shows as <b>In Suits</b>: $0, no matter their ' +
      'starts, until they score.'
    : '<b>This contest resets monthly.</b> Payout below assumes your current team ends up winning the pot for ' +
      'this contest period, split by each player\'s share of starts on their team (legacy rules — locked in for ' +
      'this month). A player who hasn\'t started a single week shows as <b>In Suits</b>: $0, no matter their stats.';
  var list = rollupPlayerStats();
  var suits = list.filter(function (r) { return r.inSuits; });
  var callout = $("suitsCallout");
  if (suits.length) {
    callout.className = "suits-callout some";
    callout.textContent = suits.length + " player" + (suits.length === 1 ? "" : "s") +
      " currently In Suits (0 points this month, no cut until they score): " + suits.map(function (r) { return r.name; }).join(", ");
  } else if (list.length) {
    callout.className = "suits-callout none";
    callout.textContent = "Everyone has scored at least 1 point this month. Nobody's in suits.";
  } else {
    callout.className = "suits-callout";
    callout.textContent = "";
  }
  $("statsRows").innerHTML = list.map(function (r, i) {
    var payoutCell = r.inSuits
      ? '<span class="stat-col payout suits">In Suits</span>'
      : '<span class="stat-col payout' + (r.payout > 0 ? " earning" : "") + '">$' + r.payout.toLocaleString() + '</span>';
    return '<div class="row">' +
      '<span class="num">' + (i + 1) + '</span>' +
      '<span class="nm">' + esc(r.name) + '</span>' +
      '<span class="team-col">' + esc(displayName(r.team)) + '</span>' +
      '<span class="stat-col">' + r.starts + '</span>' +
      '<span class="stat-col">' + r.offers + '</span>' +
      '<span class="stat-col">' + r.weeks50 + '</span>' +
      '<span class="stat-col">' + r.contacts + '</span>' +
      '<span class="stat-col">' + Math.round(r.avgContacts) + '</span>' +
      '<span class="stat-col">' + Math.round(r.avgOffers) + '</span>' +
      '<span class="stat-col total">' + r.total + '</span>' +
      payoutCell + '</div>';
  }).join("") || '<div class="legend">No data yet.</div>';
}

/* ---------- weekly board ---------- */
function renderWeek() {
  var wk = getWeek(selectedWeek);
  $("banner").textContent = activeLabel() + " — Week " + selectedWeek;
  if (!wk) { $("board").innerHTML = ""; $("legend").innerHTML = ""; return; }

  var suitsMap = {};
  rollupPlayerStats().forEach(function (r) { suitsMap[r.name] = r.inSuits; });

  var scored = wk.teams.map(function (t) {
    return { t: t, score: teamScore(t), swaps: projectLineup(t) };
  });
  var best = Math.max.apply(null, scored.map(function (x) { return x.score; }).concat(0));

  $("board").innerHTML = scored.map(function (x) {
    var t = x.t;
    var starters = t.players.filter(function (p) { return p.starter; });
    var bench    = t.players.filter(function (p) { return !p.starter; });
    var outN = {}; x.swaps.demoted.forEach(function (p) { outN[p.name] = 1; });
    var inN  = {}; x.swaps.promoted.forEach(function (p) { inN[p.name] = 1; });

    var i = 0;
    function line(p, cls) {
      i++;
      var flags = (outN[p.name] ? '<span class="flag out">Out</span>' : "") +
                  (inN[p.name] ? '<span class="flag in">In</span>' : "") +
                  ((suitsMap[p.name] && !inN[p.name]) ? '<span class="flag suit">Suit</span>' : "");
      var hit50 = (Number(p.contacts) || 0) >= 50;
      return '<div class="row ' + cls + '"><span class="num">' + i + '</span>' +
        '<span class="nm">' + esc(p.name) + '</span>' + flags +
        '<span class="ct">' + (hit50 ? "<b>" : "") + (Number(p.contacts) || 0) + "/50 cts" + (hit50 ? "</b>" : "") + '</span>' +
        '<span class="pts">' + totalPoints(p) + '</span></div>';
    }
    var note = x.swaps.promoted.length
      ? '<b>' + x.swaps.promoted.map(function (p) { return esc(p.name); }).join(", ") +
        '</b> starts next week over <b>' +
        x.swaps.demoted.map(function (p) { return esc(p.name); }).join(", ") + '</b>'
      : 'Lineup holds. No bench player is beating a starter.';

    var lead = x.score === best && best > 0;
    var bothAll = teamHitBothThisWeek(t);
    return '<div class="card ' + (lead ? "leader" : "") + '">' +
      (lead ? '<span class="crown">Leader</span>' : "") +
      '<div class="team-name">' + esc(displayName(t.sheetName)) + '</div>' +
      '<div class="score-box"><div class="lbl">Team Score</div><div class="val">' + x.score + '</div></div>' +
      (bothAll ? '<div class="both-flag">🔥 Whole starting lineup hit BOTH goals this week</div>' : '') +
      '<div class="sec">Starting Lineup</div>' +
      starters.map(function (p) { return line(p, "start"); }).join("") +

      bench.map(function (p) { return line(p, "bench"); }).join("") +
      '<div class="swap-note">' + note + '</div></div>';
  }).join("");

  var ver = activeScoringVersion();
  var scoringLine = ver >= 2
    ? '<b>Scoring:</b> 1/offer &nbsp;+&nbsp; 2 for 50 contacts &nbsp;+&nbsp; 1 more for hitting both'
    : '<b>Scoring:</b> 1/offer &nbsp;+&nbsp; 1 for 50 contacts &nbsp;(legacy rules — locked in for this month)';
  $("legend").innerHTML = scoringLine +
    ' &nbsp;&middot;&nbsp; <b>Team score</b> counts starters only' +
    ' &nbsp;&middot;&nbsp; <b>Green IN / red OUT</b> is next week\'s swap if the sheet holds' +
    ' &nbsp;&middot;&nbsp; A tie goes to whoever has more offers, even over the 50-contacts bonus' +
    ' &nbsp;&middot;&nbsp; still tied on offers? Higher contacts wins';
}

/* ---------- month board ---------- */
function rollupMonth() {
  var weeks = activeData().weeks.slice().sort(function (a, b) { return a.week - b.week; });
  if (!weeks.length) return null;
  var map = {}, order = [];

  weeks.forEach(function (wk) {
    wk.teams.forEach(function (t) {
      if (!map[t.sheetName]) { map[t.sheetName] = {}; order.push(t.sheetName); }
      var roster = map[t.sheetName];
      t.players.forEach(function (p) {
        if (!roster[p.name]) roster[p.name] = { name: p.name, points: 0, starts: 0 };
        if (p.starter) {
          roster[p.name].points += totalPoints(p);
          roster[p.name].starts += 1;
        }
      });
    });
  });

  // pot: this pot is only ever split among ONE team's own 5 players (whichever team wins),
  // by each player's share of that team's total points — never pooled across the league,
  // and never by starts.
  var out = order.map(function (sn) {
    var players = Object.keys(map[sn]).map(function (k) { return map[sn][k]; })
      .sort(function (a, b) { return b.points - a.points || b.starts - a.starts; });
    var teamStarts = players.reduce(function (s, p) { return s + p.starts; }, 0);
    var teamPoints = players.reduce(function (s, p) { return s + p.points; }, 0);
    return {
      sheetName: sn, players: players, teamStarts: teamStarts, teamPoints: teamPoints,
      score: teamPoints
    };
  });
  return { teams: out, weeks: weeks.map(function (w) { return w.week; }) };
}

function renderMonth() {
  var m = rollupMonth();
  $("banner").textContent = activeLabel() + " — Month";
  if (!m) { $("board").innerHTML = ""; $("legend").innerHTML = ""; return; }

  var best = Math.max.apply(null, m.teams.map(function (t) { return t.score; }).concat(0));
  var basePot = activeData().pot;
  var ver = activeScoringVersion();

  $("board").innerHTML = m.teams.map(function (t) {
    var pot = effectivePot(t.sheetName);
    var rows = t.players.map(function (p, i) {
      var pay;
      if (ver >= 2) {
        pay = (p.points > 0 && t.teamPoints > 0) ? Math.round((p.points / t.teamPoints) * pot) : 0;
      } else {
        pay = (p.starts > 0 && t.teamStarts > 0) ? Math.round((p.starts / t.teamStarts) * pot) : 0;
      }
      var hasRole = ver >= 2 ? p.points > 0 : p.starts > 0;
      return '<div class="row ' + (hasRole ? "roster" : "bench") + '">' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="nm">' + esc(p.name) + '</span>' +
        '<span class="starts">' + p.starts + '</span>' +
        '<span class="pts">' + p.points + '</span>' +
        '<span class="ct">' + (pay > 0 ? "$" + pay.toLocaleString() : "—") + '</span></div>';
    }).join("");
    var lead = t.score === best && best > 0;
    var bonus = Number((activeData().teamPotBonus || {})[t.sheetName]) || 0;
    return '<div class="card ' + (lead ? "leader" : "") + '">' +
      (lead ? '<span class="crown">Leader</span>' : "") +
      '<div class="team-name">' + esc(displayName(t.sheetName)) + '</div>' +
      '<div class="score-box"><div class="lbl">Team Score</div><div class="val">' + t.score + '</div></div>' +
      '<div class="sec">Pot if they win: $' + pot.toLocaleString() +
        (bonus ? ' <span style="color:var(--muted);font-weight:400">($' + basePot.toLocaleString() + ' base + $' + bonus.toLocaleString() + ' added)</span>' : '') +
      '</div>' +
      '<div class="sec">Roster</div>' +
      '<div class="colhead"><span class="num" style="visibility:hidden"></span>' +
        '<span class="nm">Agent</span><span class="starts">Starts</span><span class="pts">Pts</span><span class="ct">If Win</span></div>' +
      rows + '</div>';
  }).join("");

  $("legend").innerHTML = ver >= 2
    ? '<b>Points</b> are starter points only. 0 points means no money.' +
      ' &nbsp;&middot;&nbsp; Weeks counted: ' + m.weeks.join(", ") + '<br>' +
      '<b>Pot</b> is $' + Number(basePot).toLocaleString() + ' base, plus whatever that specific team has added — ' +
      'only the winning team\'s own pot pays out, split by each player\'s share of their team\'s points, never league-wide.' +
      ' "If Win" above shows what each player would get were their own team to take the pot.'
    : '<b>Points</b> are starter points only. A 0 in Starts means no money (legacy rules — locked in for this month).' +
      ' &nbsp;&middot;&nbsp; Weeks counted: ' + m.weeks.join(", ") + '<br>' +
      '<b>Pot</b> $' + Number(basePot).toLocaleString() + ' is only ever split among the winning team\'s own roster,' +
      ' proportional to their starts — never across the whole league.' +
      ' "If Win" above shows what each player would get were their own team to take the pot.';
}

          '<span class="epot-total">→ $' + effectivePot(t.sheetName).toLocaleString() + ' if this team wins</span>' +
        '</div>'
      : '';
    return '<div class="ecard' + (locked ? ' is-locked' : '') + '">' +
      '<input class="tname" data-t="' + ti + '" data-k="teamname" value="' + esc(displayName(t.sheetName)) + '"' + (locked?' disabled':'') + '>' +
      '<div class="escore">Team score<span>' + teamScore(t) + '</span></div>' +
      (bothAll ? '<div class="both-flag">🔥 Whole starting lineup hit BOTH goals this week — consider adding to the pot</div>' : '') +
      potBonusRow +
      '<div class="ehead"><span class="eh-nm">Agent</span><span class="eh-pt">Pts</span>' +
        '<span class="eh-ct">Contacts</span><span class="eh-rl">Role</span><span class="eh-x"></span></div>' +
      rows +
      '<button class="eadd" data-t="' + ti + '"' + (locked?' disabled':'') + '>+ Add agent</button>' +
    '</div>';
  }).join("");
}

/* editor events (delegated) */
$("editGrid").addEventListener("input", function (e) {
  var el = e.target;
  if (isLocked()) return;
  if (el.classList.contains("epotbonus")) return; // handled by its own listener below
  var wk = getWeek(selectedWeek); if (!wk) return;
  var ti = Number(el.getAttribute("data-t"));

  if (el.classList.contains("tname")) {
    var sn = wk.teams[ti].sheetName;
    activeData().displayNames[sn] = el.value;
    queueSave();
    return;
  }
  var pi = Number(el.getAttribute("data-p"));
  var k = el.getAttribute("data-k");
  var player = wk.teams[ti].players[pi];
  if (k === "name") player.name = el.value;
  else if (k === "points") player.points = Number(el.value) || 0;
  else if (k === "contacts") {
    player.contacts = Number(el.value) || 0;
    var hit = contactBonus(player) > 0;
    el.classList.toggle("bonus-hit", hit);
    var badgeEl = el.closest(".ect-wrap").querySelector(".ect-badge");
    if (badgeEl) badgeEl.classList.toggle("show", hit);
  }
  // live team score
  var badge = el.closest(".ecard").querySelector(".escore span");
  if (badge) badge.textContent = teamScore(wk.teams[ti]);
  queueSave();
});

$("editGrid").addEventListener("change", function (e) {
  var el = e.target;
  if (isLocked()) return;
  if (!el.classList.contains("erl")) return;
  var wk = getWeek(selectedWeek); if (!wk) return;
  var ti = Number(el.getAttribute("data-t"));
  var pi = Number(el.getAttribute("data-p"));
  wk.teams[ti].players[pi].starter = el.value === "1";
  var badge = el.closest(".ecard").querySelector(".escore span");
  if (badge) badge.textContent = teamScore(wk.teams[ti]);
  queueSave();
});

$("editGrid").addEventListener("click", function (e) {
  var el = e.target;
  if (isLocked()) return;
  var wk = getWeek(selectedWeek); if (!wk) return;

  if (el.classList.contains("ex")) {
    var ti = Number(el.getAttribute("data-t"));
    var pi = Number(el.getAttribute("data-p"));
    wk.teams[ti].players.splice(pi, 1);
    queueSave(); renderEditor();
  } else if (el.classList.contains("eadd")) {
    var t2 = Number(el.getAttribute("data-t"));
    wk.teams[t2].players.push({ name: "New Agent", points: 0, contacts: 0, starter: false });
    queueSave(); renderEditor();
  }
});

$("potInput").addEventListener("input", function (e) {
  if (isLocked()) return;
  activeData().pot = Number(e.target.value) || 0;
  queueSave();
});

$("editGrid").addEventListener("input", function (e) {
  var el = e.target;
  if (isLocked()) return;
  if (!el.classList.contains("epotbonus")) return;
  var sn = el.getAttribute("data-team");
  var d = activeData();
  if (!d.teamPotBonus) d.teamPotBonus = {};
  d.teamPotBonus[sn] = Number(el.value) || 0;
  var totalEl = el.closest(".epot-row").querySelector(".epot-total");
  if (totalEl) totalEl.textContent = "→ $" + effectivePot(sn).toLocaleString() + " if this team wins";
  queueSave();
});

/* ---------- week controls ---------- */
function refreshWeekPick() {
  var weeks = activeData().weeks.map(function (w) { return w.week; }).sort(function (a, b) { return a - b; });
  if (weeks.indexOf(selectedWeek) === -1) selectedWeek = weeks[weeks.length - 1] || 1;
  $("weekPick").innerHTML = weeks.map(function (w) {
    return '<option value="' + w + '"' + (w === selectedWeek ? " selected" : "") + '>Week ' + w + '</option>';
  }).join("");
}
function refreshMonthPick() {
  var opts = [{ v: "current", label: state.monthLabel || "Current" }];
  (state.monthHistory || []).forEach(function (h, i) { opts.push({ v: String(i), label: h.label }); });
  $("monthPick").innerHTML = opts.map(function (o) {
    var val = viewingArchive === null ? "current" : String(viewingArchive);
    return '<option value="' + o.v + '"' + (o.v === val ? " selected" : "") + '>' + esc(o.label) + '</option>';
  }).join("");
  $("monthPick").style.display = opts.length > 1 ? "" : "none";
}

$("addWeekBtn").addEventListener("click", function () {
  if (isLocked()) { alert("This month is locked. Unlock it first to add a week."); return; }
  var d = activeData();
  var maxW = d.weeks.reduce(function (m, w) { return Math.max(m, w.week); }, 0);
  var prev = getWeek(maxW);
  var newTeams;
  if (prev) {
    newTeams = prev.teams.map(function (t) {
      var proj = projectLineup(t);
      var startNext = {};
      // rebuild next lineup: top N by total points, tie goes to whoever has
      // more raw offers (outweighs the 50-contacts bonus), then higher
      // contacts, then the incumbent starter — see lineupSort
      var n = t.players.filter(function (p) { return p.starter; }).length;
      var ranked = t.players.slice().sort(lineupSort);
      ranked.slice(0, n).forEach(function (p) { startNext[p.name] = true; });
      return {
        sheetName: t.sheetName,
        players: t.players.map(function (p) {
          return { name: p.name, points: 0, contacts: 0, starter: !!startNext[p.name] };
        })
      };
    });
  } else {
    newTeams = JSON.parse(JSON.stringify(SEED.weeks[0].teams));
  }
  d.weeks.push({ week: maxW + 1, teams: newTeams });
  selectedWeek = maxW + 1;
  queueSave();
  refreshWeekPick();
  draw();
});

$("delWeekBtn").addEventListener("click", function () {
  if (isLocked()) { alert("This month is locked. Unlock it first to delete a week."); return; }
  var d = activeData();
  if (d.weeks.length <= 1) { alert("You need at least one week."); return; }
  if (!confirm("Delete Week " + selectedWeek + " from " + activeLabel() + "? This cannot be undone.")) return;
  d.weeks = d.weeks.filter(function (w) { return w.week !== selectedWeek; });
  queueSave();
  refreshWeekPick();
  draw();
});

$("lockBtn").addEventListener("click", function () {
  var d = activeData();
  d.locked = !d.locked;
  queueSave();
  renderEditor();
});

$("newMonthBtn").addEventListener("click", function () {
  viewingArchive = null; // New Month always operates on the live month
  var closingLabel = state.monthLabel || "Untitled month";
  var newLabel = window.prompt(
    'What do you want to call the new month that\'s starting now? ("' + closingLabel + '" will be archived as-is.)',
    ""
  );
  if (newLabel === null) return; // cancelled

  // Archive the closing month right into the shared data so anyone with the link can browse it later.
  // Its own existing label and data are left untouched — only the new month's name is being set here.
  // It's tagged with whatever scoring rules were live when it was played, and auto-locked so its
  // numbers can't drift after the fact — unlock it from Edit Data if a correction is truly needed.
  if (!state.monthHistory) state.monthHistory = [];
  ensureMonthDefaults(state);
  state.monthHistory.push({
    label: closingLabel,
    weeks: JSON.parse(JSON.stringify(state.weeks)),
    pot: state.pot,
    displayNames: JSON.parse(JSON.stringify(state.displayNames || {})),
    teamPotBonus: JSON.parse(JSON.stringify(state.teamPotBonus || {})),
    scoringVersion: state.scoringVersion || 2,
    locked: true
  });

  // Also auto-download a local backup as a redundant safety net.
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  var safeLabel = closingLabel.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  a.download = "sig-baseball-" + safeLabel + "-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);

  var maxW = state.weeks.reduce(function (m, w) { return Math.max(m, w.week); }, 0);
  var prev = getWeek(maxW);
  var newTeams = prev ? prev.teams.map(function (t) {
    return {
      sheetName: t.sheetName,
      players: t.players.map(function (p) {
        return { name: p.name, points: 0, contacts: 0, starter: p.starter };
      })
    };
  }) : JSON.parse(JSON.stringify(SEED.weeks[0].teams));

  state.weeks = [{ week: 1, teams: newTeams }];
  state.monthLabel = newLabel || "New month";
  state.teamPotBonus = {}; // fresh month, fresh bonuses — each team starts back at the base pot
  state.scoringVersion = 2;
  state.locked = false;
  ensureMonthDefaults(state);
  selectedWeek = 1;
  viewingArchive = null;
  queueSave();
  refreshWeekPick();
  refreshMonthPick();
  draw();
  alert('"' + closingLabel + '" is now saved, locked, and viewable from the Month dropdown. ' +
    'Started fresh as "' + (newLabel || "New month") +
    '" — don\'t forget to update the Base pot $ amount below if it changed.');
});

$("weekPick").addEventListener("change", function (e) {
  selectedWeek = Number(e.target.value);
  draw();
});

$("monthPick").addEventListener("change", function (e) {
  var v = e.target.value;
  viewingArchive = v === "current" ? null : Number(v);
  refreshWeekPick();
  draw();
});

async function saveNow() {
  var btns = [$("saveNowBtn"), $("saveNowBtn2")];
  btns.forEach(function (b) { b.disabled = true; b.textContent = "Saving…"; });
  await waitForPendingSave(); // let any earlier in-flight or queued auto-save finish first, so we're never racing it
  var snapshot = JSON.stringify(state);
  await save();

  if (persistOK) {
    btns.forEach(function (b) { b.textContent = "Verifying…"; });
    try {
      var readBack = await loadState();
      var n = $("saveNote");
      if (JSON.stringify(readBack) === snapshot) {
        n.className = "savenote ok";
        n.textContent = "Saved AND verified — read it straight back from the server and it matches exactly.";
      } else {
        n.className = "savenote warn";
        n.textContent = "Warning: the server said it saved, but reading it back shows different data. " +
          "This is a real backend bug, not something you did wrong — screenshot this and send it over.";
      }
    } catch (err) {
      var n2 = $("saveNote");
      n2.className = "savenote warn";
      n2.textContent = "Saved, but couldn't verify the read-back (network issue checking). Try Save Now again in a moment.";
    }
  }
  btns.forEach(function (b) { b.disabled = false; b.textContent = "Save Now"; });
}
$("saveNowBtn").addEventListener("click", saveNow);
$("saveNowBtn2").addEventListener("click", saveNow);

/* ---------- backup export / import ---------- */
$("exportBtn").addEventListener("click", function () {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sig-baseball-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
});
$("importBtn").addEventListener("click", function () { $("importFile").click(); });
$("importFile").addEventListener("change", function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var data = JSON.parse(r.result);
      if (!data.weeks) throw new Error("not a scoreboard backup");
      state = data;
      if (state.pot == null) state.pot = 1500;
      if (!state.displayNames) state.displayNames = {};
      if (!state.monthLabel) state.monthLabel = "Current";
      if (!state.monthHistory) state.monthHistory = [];
      ensureMonthDefaults(state);
      viewingArchive = null;
      selectedWeek = state.weeks.reduce(function (m, w) { return Math.max(m, w.week); }, state.weeks[0].week);
      queueSave();
      refreshWeekPick();
      refreshMonthPick();
      draw();
    } catch (err) { alert("Could not read that file: " + err.message); }
  };
  r.readAsText(f);
  e.target.value = "";
});

/* ---------- view switching ---------- */
function draw() {
  $("boardWrap").style.display = "none";
  $("statsWrap").style.display = "none";
  $("editWrap").style.display = "none";
  if (view === "week") { $("boardWrap").style.display = ""; renderWeek(); }
  else if (view === "month") { $("boardWrap").style.display = ""; renderMonth(); }
  else if (view === "stats") { $("statsWrap").style.display = ""; renderStats(); }
  else { $("editWrap").style.display = ""; renderEditor(); }
}

function setView(v) {
  view = v;
  $("tabWeek").setAttribute("aria-selected", v === "week");
  $("tabMonth").setAttribute("aria-selected", v === "month");
  $("tabStats").setAttribute("aria-selected", v === "stats");
  $("tabEdit").setAttribute("aria-selected", v === "edit");
  var showWeekControls = (v === "week" || v === "edit");
  $("weekPick").style.display = showWeekControls ? "" : "none";
  $("delWeekBtn").style.display = v === "edit" ? "" : "none";
  $("lockBtn").style.display = v === "edit" ? "" : "none";
  // addWeekBtn / newMonthBtn visibility (edit view + live month only) is handled inside renderEditor()
  if (v !== "edit") { $("addWeekBtn").style.display = "none"; $("newMonthBtn").style.display = "none"; }
  $("ctxLabel").textContent = v === "month" ? "All weeks" : "Week";
  refreshWeekPick();
  refreshMonthPick();
  draw();
}

var editPin = null;
var pinVerified = false;
async function verifyPin(pin) {
  try {
    var res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ mode: "verify", pin: pin })
    });
    var data = await res.json();
    return !!(data && data.ok);
  } catch (e) { return false; }
}
$("tabWeek").addEventListener("click", function () { setView("week"); });
$("tabMonth").addEventListener("click", function () { setView("month"); });
$("tabStats").addEventListener("click", function () { setView("stats"); });
$("tabEdit").addEventListener("click", async function () {
  if (!pinVerified) {
    var entered = window.prompt("Enter PIN to edit data:");
    if (entered === null) return; // cancelled
    var btn = $("tabEdit");
    btn.disabled = true; btn.textContent = "Checking…";
    var ok = await verifyPin(entered);
    btn.disabled = false; btn.textContent = "Edit Data";
    if (!ok) { alert("Incorrect PIN."); return; }
    editPin = entered;
    pinVerified = true;
  }
  // Pull the freshest data right now, so editing never starts from a stale local copy
  // that could silently overwrite someone else's more recent save.
  var btn2 = $("tabEdit");
  btn2.disabled = true; btn2.textContent = "Loading latest…";
  try {
    var fresh = await loadState();
    state = fresh;
    if (!state.monthLabel) state.monthLabel = "July";
    if (!state.monthHistory) state.monthHistory = [];
    ensureMonthDefaults(state);
    refreshWeekPick();
    refreshMonthPick();
    setView("edit");
  } catch (err) {
    alert("Couldn't load the latest data from the server, so editing was blocked to protect what's already saved. Check your connection and try again.");
  } finally {
    btn2.disabled = false; btn2.textContent = "Edit Data";
  }
});

/* ---------- refresh (pull latest shared data) ---------- */
async function refreshFromServer() {
  if (view === "edit") return; // don't yank the editor out from under someone typing
  try {
    var fresh = await loadState();
    state = fresh;
    if (!state.monthLabel) state.monthLabel = "July";
    if (!state.monthHistory) state.monthHistory = [];
    ensureMonthDefaults(state);
    if (viewingArchive !== null && !state.monthHistory[viewingArchive]) viewingArchive = null;
    refreshWeekPick();
    refreshMonthPick();
    draw();
  } catch (err) {
    console.warn("Refresh failed, keeping last known good data:", err);
  }
}
$("refreshBtn").addEventListener("click", function () { refreshFromServer(); });
setInterval(refreshFromServer, 20000);

/* ---------- boot ---------- */
async function boot() {
  $("board").innerHTML = '<div class="legend">Loading scoreboard…</div>';
  try {
    state = await loadState();
  } catch (err) {
    $("board").innerHTML = '<div class="legend" style="color:var(--down)">' +
      'Couldn\'t reach the server to load data. Check your connection and refresh the page. ' +
      '(Nothing was overwritten — this is just a load failure.)</div>';
    return;
  }
  if (!state.monthLabel) state.monthLabel = "July";
  if (!state.monthHistory) state.monthHistory = [];
  ensureMonthDefaults(state);
  selectedWeek = (state.weeks || []).reduce(function (m, w) { return Math.max(m, w.week); }, 1);
  refreshWeekPick();
  refreshMonthPick();
  showSaveNote();
  setView("week");
}
boot();
